name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────
# Jobs
# ──────────────────────────────────────────────────────────
jobs:

  # ── Python: Lint & Format ────────────────────────────────
  python-lint:
    name: "Python · Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black ruff

      - name: Check formatting (Black)
        if: always()
        run: |
          echo "::group::Black --check --diff"
          black --check --diff src tests app inference schemas config utils scripts
          echo "::endgroup::"

      - name: Lint (Ruff)
        if: always()
        run: |
          echo "::group::Ruff check"
          ruff check src tests app inference schemas config utils scripts \
            --output-format=github \
            --target-version=py312
          echo "::endgroup::"

      - name: Check formatting (Ruff)
        if: always()
        run: |
          echo "::group::Ruff format --check"
          ruff format --check --diff src tests app inference schemas config utils scripts
          echo "::endgroup::"

  # ── Python: Tests ────────────────────────────────────────
  python-test:
    name: "Python · Tests"
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-html

      - name: Run tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --junitxml=test-results/junit.xml \
            --html=test-results/report.html \
            --self-contained-html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  # ── Frontend: Lint, Format & Build ───────────────────────
  frontend-lint:
    name: "Frontend · Lint, Format & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npx prettier --check .

      - name: Build
        run: npm run build

